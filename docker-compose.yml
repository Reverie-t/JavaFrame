services:
  backend:
    build: ./JavaFrame
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-admin}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?请在 .env 中设置 APP_AUTH_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?请在 .env 中设置 APP_JWT_SECRET（至少 32 字节）}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./javaframeff
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
